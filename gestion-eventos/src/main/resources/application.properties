# Nombre de tu aplicación
spring.application.name=ElAlephSystem

# Conexión a Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/el_aleph_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# 🔴 ATENCIÓN: CAMBIA 'tu_contraseña' POR LA QUE CREASTE EN LA INSTALACIÓN
spring.datasource.password=g1234567P

# Configuración de JPA (Hibernate)
# Esto actualiza las tablas automáticamente si cambias algo en el código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Thymeleaf (Frontend)
spring.thymeleaf.cache=false