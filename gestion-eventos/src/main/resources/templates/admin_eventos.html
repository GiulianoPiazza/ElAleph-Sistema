<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eventos - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style> 
        .x-small { font-size: 10px; } 
        .archivado { background-color: #e9ecef; opacity: 0.85; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow">
        <div class="container">
            <span class="navbar-brand">🏢 Administración de Eventos</span>
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Volver al Panel</a>
        </div>
    </nav>

    <div class="container-fluid px-4">
        
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong th:text="${errorMsg}"></strong><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show shadow-sm border-success" role="alert">
            <strong th:text="${successMsg}"></strong><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="alert alert-warning shadow-sm border-warning mb-4">
            <div class="row align-items-center">
                <div class="col-md-5">
                    <strong class="fs-5">📈 Ajuste General de Precios</strong> <br>
                    <span class="text-dark small">Aplica un porcentaje a todas las fiestas <strong class="text-danger">ACTIVAS</strong>. Los eventos archivados están protegidos.</span>
                </div>
                <div class="col-md-7 text-end">
                    <form th:action="@{/admin/eventos/aumento-general}" method="post" class="d-inline-flex align-items-center" onsubmit="return confirm('¿Estás SEGURO de aplicar este porcentaje a los eventos activos?')">
                        <div class="input-group input-group-sm me-2" style="width: 150px;">
                            <input type="number" step="0.1" name="porcentaje" class="form-control" placeholder="Ej: 3.5" required>
                            <span class="input-group-text fw-bold">%</span>
                        </div>
                        <button type="submit" class="btn btn-danger btn-sm fw-bold shadow">Aplicar Aumento</button>
                    </form>
                    <form th:if="${session.backupPrecios != null}" th:action="@{/admin/eventos/deshacer-aumento}" method="post" class="d-inline-flex ms-2">
                        <button type="submit" class="btn btn-dark btn-sm fw-bold shadow" onclick="return confirm('¿Deshacer el último aumento?')">↩️ Deshacer Error</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-3">
                <div class="card shadow border-0 mb-4">
                    <div class="card-header bg-dark text-white fw-bold">Nuevo Evento</div>
                    <div class="card-body">
                        <form th:action="@{/admin/eventos/crear}" method="post">
                            <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre de la fiesta" required>
                            <input type="date" name="fecha" class="form-control mb-2" required>
                            <input type="time" name="hora" class="form-control mb-2" required>
                            <input type="text" name="lugar" class="form-control mb-2" placeholder="Lugar" required>
                            <label class="small fw-bold">Precios:</label>
                            <input type="number" step="0.01" name="precioAdulto" class="form-control mb-2" placeholder="Precio Adulto">
                            <input type="number" step="0.01" name="precioAdolescente" class="form-control mb-2" placeholder="Precio Adolescente">
                            <input type="number" step="0.01" name="precioMenor" class="form-control mb-2" placeholder="Precio Menor">
                            <input type="number" step="0.01" name="precioFiesta" class="form-control mb-3" placeholder="Precio Fiesta">
                            <button type="submit" class="btn btn-success w-100 fw-bold">Guardar Evento</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card shadow border-0">
                    <div class="card-header bg-secondary text-white fw-bold d-flex justify-content-between align-items-center">
                        <span>Eventos Agendados</span>
                        
                        <form th:action="@{/admin/eventos}" method="get" class="d-flex" style="max-width: 450px;">
                            <input type="text" name="buscarTexto" th:value="${buscarTexto}" class="form-control form-control-sm me-1" placeholder="Nombre...">
                            <input type="date" name="buscarFecha" th:value="${buscarFecha}" class="form-control form-control-sm me-1" title="Filtrar por fecha exacta">
                            <button type="submit" class="btn btn-light btn-sm fw-bold">🔍</button>
                            <a href="/admin/eventos" class="btn btn-dark btn-sm ms-1" title="Limpiar todos los filtros">✖</a>
                        </form>

                    </div>
                    <div class="card-body p-0">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-light"><tr><th class="ps-3">Estado</th><th>Configuración y Precios</th><th class="text-end pe-3">Gestión</th></tr></thead>
                            <tbody>
                                <tr th:each="e : ${eventos}" th:classappend="${e.activo != null && !e.activo ? 'archivado' : ''}">
                                    
                                    <td class="ps-3 text-center">
                                        <span th:if="${e.activo != null && e.activo}" class="badge bg-success">ACTIVO</span>
                                        <span th:if="${e.activo != null && !e.activo}" class="badge bg-secondary">🔒 ARCHIVADO</span>
                                    </td>
                                    
                                    <td>
                                        <form th:action="@{/admin/eventos/modificar}" method="post" class="row g-1 p-2 border rounded m-1 bg-white">
                                            <input type="hidden" name="idEvento" th:value="${e.id_evento}">
                                            
                                            <div class="col-12"><input type="text" name="nombre" th:value="${e.nombre}" class="form-control form-control-sm fw-bold" th:readonly="${e.activo != null && !e.activo}"></div>
                                            <div class="col-4"><input type="date" name="fecha" th:value="${e.fecha}" class="form-control form-control-sm" th:readonly="${e.activo != null && !e.activo}"></div>
                                            <div class="col-4"><input type="time" name="hora" th:value="${e.hora}" class="form-control form-control-sm" th:readonly="${e.activo != null && !e.activo}"></div>
                                            <div class="col-4"><input type="text" name="lugar" th:value="${e.lugar}" class="form-control form-control-sm" th:readonly="${e.activo != null && !e.activo}"></div>
                                            
                                            <div class="col-3"><label class="x-small text-muted fw-bold">Adulto $</label><input type="number" step="0.01" name="precioAdulto" th:value="${e.precio_adulto}" class="form-control form-control-sm fw-bold" th:readonly="${e.activo != null && !e.activo}"></div>
                                            <div class="col-3"><label class="x-small text-muted fw-bold">Adoles. $</label><input type="number" step="0.01" name="precioAdolescente" th:value="${e.precio_adolescente}" class="form-control form-control-sm fw-bold" th:readonly="${e.activo != null && !e.activo}"></div>
                                            <div class="col-3"><label class="x-small text-muted fw-bold">Menor $</label><input type="number" step="0.01" name="precioMenor" th:value="${e.precio_menor}" class="form-control form-control-sm fw-bold" th:readonly="${e.activo != null && !e.activo}"></div>
                                            <div class="col-3"><label class="x-small text-muted fw-bold">Fiesta $</label><input type="number" step="0.01" name="precioFiesta" th:value="${e.precio_fiesta}" class="form-control form-control-sm fw-bold" th:readonly="${e.activo != null && !e.activo}"></div>
                                            
                                            <div class="col-12 mt-1" th:if="${e.activo != null && e.activo}">
                                                <button type="submit" class="btn btn-warning btn-sm w-100 fw-bold">Actualizar Solo Este Evento</button>
                                            </div>
                                        </form>
                                    </td>
                                    <td class="text-end pe-3">
                                        <form th:action="@{/admin/eventos/archivar}" method="post" class="mb-1" onsubmit="return confirm('¿Cambiar el estado de congelamiento de este evento?');">
                                            <input type="hidden" name="idEvento" th:value="${e.id_evento}">
                                            <button type="submit" class="btn btn-sm w-100 fw-bold" th:classappend="${e.activo != null && e.activo ? 'btn-secondary' : 'btn-success'}">
                                                <span th:text="${e.activo != null && e.activo ? '🔒 Archivar' : '🔓 Reactivar'}"></span>
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/eventos/eliminar}" method="post" onsubmit="return confirm('¿Estás seguro de eliminar este evento completo?');">
                                            <input type="hidden" name="idEvento" th:value="${e.id_evento}">
                                            <button type="submit" class="btn btn-outline-danger btn-sm w-100">🗑️ Borrar</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
