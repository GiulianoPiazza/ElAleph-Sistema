<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eventos - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4 shadow">
        <div class="container">
            <span class="navbar-brand">🏢 Administración de Eventos</span>
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Volver</a>
        </div>
    </nav>

    <div class="container">
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong th:text="${errorMsg}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white">Nuevo Evento</div>
                    <div class="card-body">
                        <form th:action="@{/admin/eventos/crear}" method="post">
                            <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre" required>
                            <input type="date" name="fecha" class="form-control mb-2" required>
                            <input type="time" name="hora" class="form-control mb-2" required>
                            <input type="text" name="lugar" class="form-control mb-2" placeholder="Lugar" required>
                            <input type="number" name="precioAdulto" class="form-control mb-2" placeholder="Precio Adulto">
                            <input type="number" name="precioMenor" class="form-control mb-2" placeholder="Precio Menor">
                            <input type="number" name="precioFiesta" class="form-control mb-3" placeholder="Precio Fiesta">
                            <button type="submit" class="btn btn-success w-100">Guardar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-secondary text-white">Eventos Agendados</div>
                    <div class="card-body p-0">
                        <table class="table table-sm align-middle mb-0">
                            <thead><tr><th class="ps-3">ID</th><th>Datos / Precios</th><th class="text-end pe-3">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="e : ${eventos}">
                                    <td class="ps-3 fw-bold" th:text="${e.id_evento}"></td>
                                    <td>
                                        <form th:action="@{/admin/eventos/modificar}" method="post" class="row g-1 p-2">
                                            <input type="hidden" name="idEvento" th:value="${e.id_evento}">
                                            <div class="col-12"><input type="text" name="nombre" th:value="${e.nombre}" class="form-control form-control-sm"></div>
                                            <div class="col-4"><input type="date" name="fecha" th:value="${e.fecha}" class="form-control form-control-sm"></div>
                                            <div class="col-4"><input type="time" name="hora" th:value="${e.hora}" class="form-control form-control-sm"></div>
                                            <div class="col-4"><input type="text" name="lugar" th:value="${e.lugar}" class="form-control form-control-sm"></div>
                                            <div class="col-4"><input type="number" name="precioAdulto" th:value="${e.precio_adulto}" class="form-control form-control-sm"></div>
                                            <div class="col-4"><input type="number" name="precioMenor" th:value="${e.precio_menor}" class="form-control form-control-sm"></div>
                                            <div class="col-4"><input type="number" name="precioFiesta" th:value="${e.precio_fiesta}" class="form-control form-control-sm"></div>
                                            <div class="col-12 mt-1"><button type="submit" class="btn btn-warning btn-sm w-100">Actualizar</button></div>
                                        </form>
                                    </td>
                                    <td class="text-end pe-3">
                                        <form th:action="@{/admin/eventos/eliminar}" method="post" onsubmit="return confirm('¿Eliminar?');">
                                            <input type="hidden" name="idEvento" th:value="${e.id_evento}">
                                            <button type="submit" class="btn btn-danger btn-sm">🗑️</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
