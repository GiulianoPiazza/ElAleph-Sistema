<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Invitados - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4">
                        <h3 class="text-center fw-bold mb-3">Registrate para la Fiesta</h3>
                        <p class="text-center text-muted small mb-4">Confirmá tu asistencia creando una cuenta</p>
                        
                        <form th:action="@{/registrar-invitado}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Nombre Completo</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Ej: Maria García" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="tu@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Elegí una Contraseña</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">¿A qué fiesta asistís?</label>
                                <select name="idEvento" class="form-select" required>
                                    <option value="" disabled selected>Seleccioná el evento...</option>
                                    <option th:each="e : ${eventos}" th:value="${e.id_evento}" th:text="${e.nombre}"></option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 shadow-sm fw-bold">Crear Cuenta e Ingresar</button>
                        </form>
                        
                        <div class="text-center mt-3 border-top pt-3">
                            <a href="/" class="text-decoration-none small text-primary">¿Ya tenés cuenta? Inicia sesión aquí</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
