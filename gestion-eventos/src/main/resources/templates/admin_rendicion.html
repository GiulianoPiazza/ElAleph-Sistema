<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rendición Mensual - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow"><div class="container">
        <span class="navbar-brand">📊 El Aleph - Rendición de Asistencia y Pagos</span>
        <a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Volver al Panel Maestro</a>
    </div></nav>

    <div class="container">
        <div class="card p-4 shadow-sm border-0 mb-4 bg-white">
            <form th:action="@{/admin/rendicion}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Seleccionar Tiempo:</label>
                    <select name="mes" class="form-select border-primary shadow-sm">
                        <option value="-1" th:selected="${mesSeleccionado == -1}" class="fw-bold text-primary">--- HISTÓRICO COMPLETO ---</option>
                        <option value="0" th:selected="${mesSeleccionado == 0}">Solo este mes actual</option>
                        <option value="1" th:selected="${mesSeleccionado == 1}">Enero</option>
                        <option value="2" th:selected="${mesSeleccionado == 2}">Febrero</option>
                        <option value="3" th:selected="${mesSeleccionado == 3}">Marzo</option>
                        <option value="4" th:selected="${mesSeleccionado == 4}">Abril</option>
                        <option value="5" th:selected="${mesSeleccionado == 5}">Mayo</option>
                        <option value="6" th:selected="${mesSeleccionado == 6}">Junio</option>
                        <option value="7" th:selected="${mesSeleccionado == 7}">Julio</option>
                        <option value="8" th:selected="${mesSeleccionado == 8}">Agosto</option>
                        <option value="9" th:selected="${mesSeleccionado == 9}">Septiembre</option>
                        <option value="10" th:selected="${mesSeleccionado == 10}">Octubre</option>
                        <option value="11" th:selected="${mesSeleccionado == 11}">Noviembre</option>
                        <option value="12" th:selected="${mesSeleccionado == 12}">Diciembre</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Filtrar por Evento:</label>
                    <select name="idEvento" class="form-select border-primary shadow-sm">
                        <option value="0">--- Sumar todos los eventos ---</option>
                        <option th:each="e : ${eventos}" th:value="${e.id_evento}" th:text="${e.nombre}" th:selected="${e.id_evento == idEventoSeleccionado}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Generar Reporte</button>
                </div>
            </form>
        </div>

        <h5 class="text-muted mb-3">Asistencia Confirmada (Personas con Pago Aprobado)</h5>
        
        <div class="row mb-4 text-center g-3">
            <div class="col-md-2">
                <div class="card p-3 shadow-sm bg-primary text-white border-0">
                    <h6 class="mb-1">Adultos</h6><h2 class="mb-0 fw-bold" th:text="${adultos}">0</h2>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card p-3 shadow-sm bg-info text-white border-0">
                    <h6 class="mb-1">Adolescentes</h6><h2 class="mb-0 fw-bold" th:text="${adolescentes}">0</h2>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card p-3 shadow-sm bg-warning text-dark border-0">
                    <h6 class="mb-1">Menores</h6><h2 class="mb-0 fw-bold" th:text="${menores}">0</h2>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card p-3 shadow-sm bg-secondary text-white border-0">
                    <h6 class="mb-1">Solo Fiesta</h6><h2 class="mb-0 fw-bold" th:text="${fiesta}">0</h2>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card p-3 shadow-sm bg-dark text-white border-0 h-100 d-flex justify-content-center">
                    <h6 class="mb-1 text-success">Total Personas: <span class="text-white" th:text="${totalPersonas}">0</span></h6>
                    <h4 class="mb-0 text-success fw-bold">Total Recaudado: <span class="text-white" th:text="${'$' + totalRecaudado}">$0.0</span></h4>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
