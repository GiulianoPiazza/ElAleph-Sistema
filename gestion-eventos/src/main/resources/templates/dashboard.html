<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>El Aleph - Mi Evento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">El Aleph - Gestión de Eventos</span>
        </div>
    </nav>

    <div class="container">
        <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            ¡Compra registrada! La empresa ha sido notificada.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">1. Mi Evento</div>
                    <div class="card-body">
                        <h5 th:text="${evento != null ? evento.nombre : 'Cargando evento...'}">Nombre del Evento</h5>
                        <hr>
                        <p><strong>📍 Lugar:</strong> <span th:text="${evento?.lugar}"></span></p>
                        <p><strong>📅 Fecha:</strong> <span th:text="${evento?.fecha}"></span></p>
                        <p><strong>⏰ Hora:</strong> <span th:text="${evento?.hora}"></span></p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-success text-white">2. Mis Entradas</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tipo</th>
                                        <th>Cant.</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="compra : ${misCompras}">
                                        <td th:text="${compra.clasificacion}"></td>
                                        <td th:text="${compra.cantidad}"></td>
                                        <td>
                                            <span th:class="${compra.estado_pago == 'PENDIENTE' ? 'badge bg-warning text-dark' : 'badge bg-success'}"
                                                  th:text="${compra.estado_pago}">
                                            </span>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(misCompras)}">
                                        <td colspan="3" class="text-center text-muted">No tienes entradas aún.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-warning">3. Comprar Entradas</div>
                    <div class="card-body">
                        <form th:action="@{/cliente/comprar}" method="post">
                            <input type="hidden" name="idUsuario" value="1">
                            
                            <div class="mb-3">
                                <label class="form-label">Tipo de Entrada:</label>
                                <select name="clasificacion" class="form-select">
                                    <option value="Adulto">Adulto ($15.000)</option>
                                    <option value="Menor">Menor ($8.000)</option>
                                    <option value="Fiesta">Solo Fiesta ($5.000)</option>
                                </select>
                                <input type="hidden" name="precioUnitario" value="15000">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Cantidad:</label>
                                <input type="number" name="cantidad" class="form-control" value="1" min="1">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Forma de Pago:</label>
                                <select name="formaPago" class="form-select">
                                    <option value="TRANSFERENCIA">Transferencia</option>
                                    <option value="EFECTIVO">Efectivo</option>
                                    <option value="TARJETA">Tarjeta</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-dark w-100">Confirmar Compra</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
