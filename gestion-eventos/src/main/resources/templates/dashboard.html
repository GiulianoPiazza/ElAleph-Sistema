<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>El Aleph - Mi Evento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">El Aleph - Gestión de Eventos</span>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">1. Información del Evento</div>
                    <div class="card-body">
                        <h5 th:text="${evento.nombre}">Nombre del Evento</h5>
                        <p><strong>Lugar:</strong> <span th:text="${evento.lugar}"></span></p>
                        <p><strong>Fecha:</strong> <span th:text="${evento.fecha}"></span></p>
                        <p><strong>Hora:</strong> <span th:text="${evento.hora}"></span></p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">2. Mis Entradas</div>
                    <div class="card-body">
                        <p>Aquí verás tus entradas compradas.</p>
                        <ul class="list-group">
                            <li class="list-group-item">Ejemplo: 2 Adultos - Pagado</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning">3. Comprar Entradas</div>
                    <div class="card-body">
                        <p>¿Necesitas más lugares?</p>
                        <button class="btn btn-outline-dark w-100">Nueva Compra</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
