<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow"><div class="container">
        <span class="navbar-brand">👥 Gestión de Clientes</span>
        <a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Volver al Panel</a>
    </div></nav>
    <div class="container">
        
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong th:text="${errorMsg}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <strong th:text="${successMsg}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card p-3 mb-4 shadow-sm border-0">
            <form th:action="@{/admin/usuarios}" method="get" class="row g-3 align-items-center">
                <div class="col-auto"><label class="fw-bold">Filtrar por Fiesta:</label></div>
                <div class="col-md-5">
                    <select name="idEvento" class="form-select">
                        <option value="0">--- Todos los eventos ---</option>
                        <option th:each="e : ${eventos}" th:value="${e.id_evento}" th:text="${e.nombre}" th:selected="${e.id_evento == idEventoSeleccionado}"></option>
                    </select>
                </div>
                <div class="col-auto"><button type="submit" class="btn btn-primary">Filtrar</button></div>
            </form>
        </div>

        <div class="row">
            <div class="col-md-4">
                <form th:action="@{/admin/usuarios/crear}" method="post" class="card p-3 shadow-sm border-0">
                    <h5 class="fw-bold">Nuevo Cliente</h5>
                    <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre (Ej: Familia Perez)" required>
                    <input type="text" name="username" class="form-control mb-2" placeholder="Usuario (Ej: perez)" required>
                    <input type="text" name="password" class="form-control mb-2" placeholder="Contraseña" required>
                    <select name="idEvento" class="form-select mb-3" required>
                        <option th:each="e : ${eventos}" th:value="${e.id_evento}" th:text="${e.nombre}"></option>
                    </select>
                    <button class="btn btn-primary w-100">Registrar</button>
                </form>
            </div>
            
            <div class="col-md-8">
                <table class="table table-hover bg-white shadow-sm align-middle">
                    <thead class="table-light"><tr><th class="ps-3">Nombre</th><th>Usuario</th><th>Contraseña</th><th>Evento</th><th>Acción</th></tr></thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td class="ps-3 fw-bold" th:text="${u.nombre_completo}"></td>
                            <td class="text-primary" th:text="${u.username}"></td>
                            <td class="text-danger fw-bold" th:text="${u.password}"></td>
                            <td><span class="badge bg-info text-dark" th:text="'#' + ${u.id_evento}"></span></td>
                            <td>
                                <button th:if="${u.rol != 'ADMIN'}" type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal" th:data-bs-target="'#modalEliminar' + ${u.id_usuario}">
                                    🗑️ Borrar
                                </button>

                                <div th:if="${u.rol != 'ADMIN'}" class="modal fade" th:id="'modalEliminar' + ${u.id_usuario}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content border-danger">
                                            <div class="modal-header bg-danger text-white">
                                                <h5 class="modal-title fw-bold">⚠️ Advertencia de Borrado Crítico</h5>
                                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                <p>Estás a punto de eliminar permanentemente al cliente <strong th:text="${u.nombre_completo}"></strong>.</p>
                                                <p class="text-danger fw-bold mb-0">¡CUIDADO! Esto también eliminará todo su historial de compras y pagos registrados en el sistema de forma irreversible.</p>
                                            </div>
                                            <div class="modal-footer bg-light">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Me equivoqué, Cancelar</button>
                                                
                                                <form th:action="@{/admin/usuarios/eliminar}" method="post" class="m-0">
                                                    <input type="hidden" name="idUsuario" th:value="${u.id_usuario}">
                                                    <input type="hidden" name="filtroEvento" th:value="${idEventoSeleccionado != null ? idEventoSeleccionado : 0}">
                                                    <button type="submit" class="btn btn-danger fw-bold">Sí, Eliminar Todo</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
