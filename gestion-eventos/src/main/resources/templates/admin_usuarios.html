<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <span class="navbar-brand">👥 Gestión de Clientes</span>
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm">Volver</a>
        </div>
    </nav>

    <div class="container">
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong th:text="${errorMsg}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white">Nuevo Cliente</div>
                    <div class="card-body">
                        <form th:action="@{/admin/usuarios/crear}" method="post">
                            <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre Completo" required>
                            <input type="email" name="email" class="form-control mb-2" placeholder="Email (Usuario)" required>
                            <input type="text" name="password" class="form-control mb-2" placeholder="Contraseña" required>
                            <select name="idEvento" class="form-select mb-3" required>
                                <option value="" disabled selected>Asignar a Fiesta...</option>
                                <option th:each="e : ${eventos}" th:value="${e.id_evento}" th:text="${e.nombre}"></option>
                            </select>
                            <button type="submit" class="btn btn-primary w-100">Registrar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-secondary text-white">Usuarios Activos</div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0 align-middle">
                            <thead><tr><th class="ps-3">Nombre</th><th>Email</th><th>Rol</th><th class="text-end pe-3">Acción</th></tr></thead>
                            <tbody>
                                <tr th:each="u : ${usuarios}">
                                    <td class="ps-3 fw-bold" th:text="${u.nombre_completo}"></td>
                                    <td th:text="${u.email}"></td>
                                    <td th:text="${u.rol}"></td>
                                    <td class="text-end pe-3">
                                        <form th:if="${u.rol != 'ADMIN'}" th:action="@{/admin/usuarios/eliminar}" method="post">
                                            <input type="hidden" name="idUsuario" th:value="${u.id_usuario}">
                                            <button type="submit" class="btn btn-danger btn-sm">🗑️</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
