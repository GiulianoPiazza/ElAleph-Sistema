<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Global - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f0f0; color: #1a1a1a; }
        .bg-aleph { background-color: #1a1a1a; }
        .text-gold { color: #D4AF37; }
        .brand-title { font-family: 'Playfair Display', serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .table-dark-aleph { background-color: #1a1a1a; color: #fff; }
        .table-hover tbody tr:hover { background-color: #fffdf5; } /* Resaltado dorado suave */
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-aleph shadow mb-4">
        <div class="container-fluid px-4">
            <span class="navbar-brand brand-title text-gold fs-3">El Aleph <span class="fs-6 font-monospace text-light ms-3">| CONTROL MAESTRO</span></span>
            <div>
                <a href="/admin/eventos" class="btn btn-sm mx-1 rounded-pill fw-bold text-white bg-secondary">Eventos</a>
                <a href="/admin/usuarios" class="btn btn-sm mx-1 rounded-pill fw-bold text-white bg-secondary">Clientes</a>
                <a href="/admin/rendicion" class="btn btn-sm mx-1 rounded-pill fw-bold" style="background-color: #D4AF37; color: #1a1a1a;">📊 Rendición</a>
                <a href="/logout" class="btn btn-danger btn-sm mx-1 rounded-pill fw-bold ms-3">Salir</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="card p-3 mb-4 shadow-sm bg-white">
            <form th:action="@{/admin/dashboard}" method="get" class="row g-3 align-items-center">
                <div class="col-auto"><label class="fw-bold text-dark">Filtrar Pagos de Fiesta:</label></div>
                <div class="col-md-4">
                    <select name="idEvento" class="form-select bg-light border-2 fw-bold text-black">
                        <option value="0">--- Todas las fiestas ---</option>
                        <option th:each="e : ${eventos}" th:value="${e.id_evento}" th:text="${e.nombre}" th:selected="${e.id_evento == idEventoSeleccionado}"></option>
                    </select>
                </div>
                <div class="col-auto"><button type="submit" class="btn btn-dark fw-bold px-4 rounded-pill">Aplicar</button></div>
            </form>
        </div>
        
        <div class="card shadow border-0 text-center py-4 mb-4" style="background: linear-gradient(135deg, #1a1a1a 0%, #333 100%); color: #fff;">
            <h6 class="fw-bold mb-2 text-gold" style="letter-spacing: 2px; font-size: 0.8rem;">TOTAL RECAUDADO (APROBADO EN PANTALLA)</h6>
            <h1 class="mb-0 brand-title fw-bold text-white" style="font-size: 3.5rem;" th:text="${'$' + total}"></h1>
        </div>
        
        <div class="card shadow-sm border-0 bg-white">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 table-striped">
                        <thead class="table-dark-aleph">
                            <tr>
                                <th class="ps-4 py-3">Fecha Carga</th>
                                <th>Dueño/Cliente</th>
                                <th>Nombre del Evento</th>
                                <th>Detalle (A/AD/M/F)</th>
                                <th>Monto Total</th>
                                <th>Pago / Comprobante</th> 
                                <th>Estado</th>
                                <th class="text-end pe-4">Acciones Críticas</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${todasLasCompras}">
                                <td class="ps-4 small text-dark fw-bold" th:text="${#temporals.format(c.fecha_compra, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="fw-bold text-black" th:text="${c.usuario?.nombre_completo}"></td>
                                <td class="text-primary small fw-bold" th:text="${c.nombre_evento}"></td>
                                <td style="font-family: monospace;" class="fw-bold text-dark" th:text="${c.clasificacion}"></td>
                                <td class="fw-bold fs-5 text-success" th:text="${'$' + c.monto_total}"></td>
                                
                                <td>
                                    <span class="badge bg-dark mb-1 d-block w-100 fw-bold" th:text="${c.forma_pago}"></span>
                                    
                                    <button th:if="${c.comprobante != null}" type="button" class="btn btn-sm w-100 fw-bold rounded-pill" style="background-color: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1;" data-bs-toggle="modal" th:data-bs-target="'#fotoModal' + ${c.id_compra}">
                                        📷 Ver Captura
                                    </button>

                                    <div th:if="${c.comprobante != null}" class="modal fade" th:id="'fotoModal' + ${c.id_compra}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog modal-dialog-centered modal-lg">
                                            <div class="modal-content border-0 shadow-lg">
                                                <div class="modal-header bg-aleph text-gold border-0">
                                                    <h5 class="modal-title brand-title fs-4">Comprobante de <span th:text="${c.usuario?.nombre_completo}"></span></h5>
                                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body text-center bg-light p-3">
                                                    <img th:src="${c.comprobante}" class="img-fluid rounded border shadow" alt="Comprobante de pago" style="max-height: 75vh;">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                
                                <td>
                                    <span th:if="${c.estado_pago == 'PENDIENTE'}" class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold" style="font-size: 0.75rem;">PENDIENTE</span>
                                    <span th:if="${c.estado_pago == 'APROBADO'}" class="badge bg-success px-3 py-2 rounded-pill fw-bold" style="font-size: 0.75rem;">APROBADO</span>
                                </td>
                                
                                <td class="text-end pe-4">
                                    <div class="d-flex justify-content-end gap-1">
                                        <form th:if="${c.estado_pago == 'PENDIENTE'}" th:action="@{/admin/aprobar-pago}" method="post">
                                            <input type="hidden" name="idCompra" th:value="${c.id_compra}"><input type="hidden" name="filtroEvento" th:value="${idEventoSeleccionado != null ? idEventoSeleccionado : 0}">
                                            <button class="btn btn-sm btn-success fw-bold rounded-pill px-3">✓ Aprobar</button>
                                        </form>
                                        <form th:if="${c.estado_pago == 'APROBADO'}" th:action="@{/admin/revertir-pago}" method="post">
                                            <input type="hidden" name="idCompra" th:value="${c.id_compra}"><input type="hidden" name="filtroEvento" th:value="${idEventoSeleccionado != null ? idEventoSeleccionado : 0}">
                                            <button class="btn btn-sm btn-outline-secondary fw-bold rounded-pill px-3">↺ Revertir</button>
                                        </form>
                                        <form th:action="@{/admin/eliminar-pago}" method="post" onsubmit="return confirm('¿BORRAR DEFINITIVAMENTE este registro de pago? No se puede deshacer.')">
                                            <input type="hidden" name="idCompra" th:value="${c.id_compra}"><input type="hidden" name="filtroEvento" th:value="${idEventoSeleccionado != null ? idEventoSeleccionado : 0}">
                                            <button class="btn btn-sm btn-danger rounded-pill px-2">🗑️</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
