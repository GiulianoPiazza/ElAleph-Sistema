<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Global - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow"><div class="container">
        <span class="navbar-brand">🛡️ El Aleph - Control Maestro</span>
        <div>
            <a href="/admin/eventos" class="btn btn-outline-info btn-sm mx-1">Eventos</a>
            <a href="/admin/usuarios" class="btn btn-outline-light btn-sm mx-1">Clientes</a>
            <a href="/admin/rendicion" class="btn btn-warning btn-sm mx-1 fw-bold">Rendición</a>
            <a href="/logout" class="btn btn-danger btn-sm mx-1">Salir</a>
        </div>
    </div></nav>

    <div class="container">
        <div class="card p-3 mb-4 shadow-sm border-0">
            <form th:action="@{/admin/dashboard}" method="get" class="row g-3 align-items-center">
                <div class="col-auto"><label class="fw-bold">Ver pagos de:</label></div>
                <div class="col-md-5">
                    <select name="idEvento" class="form-select">
                        <option value="0">--- Todas las fiestas ---</option>
                        <option th:each="e : ${eventos}" th:value="${e.id_evento}" th:text="${e.nombre}" th:selected="${e.id_evento == idEventoSeleccionado}"></option>
                    </select>
                </div>
                <div class="col-auto"><button type="submit" class="btn btn-primary">Filtrar</button></div>
            </form>
        </div>
        
        <div class="card bg-success text-white shadow border-0 text-center py-3 mb-4">
            <h4 class="mb-0">Recaudación: <span th:text="${'$' + total}"></span></h4>
        </div>
        
        <div class="card shadow border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-3">Fecha</th>
                                <th>Invitado</th>
                                <th>Evento</th>
                                <th>Detalle (A/AD/M/F)</th>
                                <th>Monto</th>
                                <th>Medio de Pago</th> <th>Estado</th>
                                <th class="text-end pe-3">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${todasLasCompras}">
                                <td class="ps-3 small text-muted" th:text="${#temporals.format(c.fecha_compra, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="fw-bold" th:text="${c.usuario?.nombre_completo}"></td>
                                <td class="text-primary small" th:text="${c.nombre_evento}"></td>
                                <td><span class="badge bg-light text-dark border" th:text="${c.clasificacion}"></span></td>
                                <td class="fw-bold" th:text="${'$' + c.monto_total}"></td>
                                
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${c.forma_pago}"></span>
                                </td>
                                
                                <td><span th:class="${c.estado_pago == 'PENDIENTE' ? 'badge bg-warning text-dark' : 'badge bg-success'}" th:text="${c.estado_pago}"></span></td>
                                
                                <td class="text-end pe-3">
                                    <form th:if="${c.estado_pago == 'PENDIENTE'}" th:action="@{/admin/aprobar-pago}" method="post" class="d-inline">
                                        <input type="hidden" name="idCompra" th:value="${c.id_compra}">
                                        <input type="hidden" name="filtroEvento" th:value="${idEventoSeleccionado != null ? idEventoSeleccionado : 0}">
                                        <button class="btn btn-sm btn-success">Aprobar</button>
                                    </form>
                                    <form th:if="${c.estado_pago == 'APROBADO'}" th:action="@{/admin/revertir-pago}" method="post" class="d-inline">
                                        <input type="hidden" name="idCompra" th:value="${c.id_compra}">
                                        <input type="hidden" name="filtroEvento" th:value="${idEventoSeleccionado != null ? idEventoSeleccionado : 0}">
                                        <button class="btn btn-sm btn-outline-warning text-dark">Revertir</button>
                                    </form>
                                    <form th:action="@{/admin/eliminar-pago}" method="post" class="d-inline" onsubmit="return confirm('¿Seguro que querés BORRAR DEFINITIVAMENTE este pago?')">
                                        <input type="hidden" name="idCompra" th:value="${c.id_compra}">
                                        <input type="hidden" name="filtroEvento" th:value="${idEventoSeleccionado != null ? idEventoSeleccionado : 0}">
                                        <button class="btn btn-sm btn-dark">🗑️</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
