<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - El Aleph</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5 text-center">
                        <h2 class="fw-bold mb-4">El Aleph</h2>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <input type="email" name="email" class="form-control" placeholder="Tu Email" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                        </form>
                        
                        <div class="mt-4 border-top pt-3">
                            <p class="small text-muted">¿Sos un invitado y no tenés cuenta?</p>
                            <a href="/registro" class="btn btn-outline-success btn-sm w-100">Registrate para tu fiesta</a>
                        </div>

                        <div th:if="${error}" class="alert alert-danger mt-3 py-2 small" th:text="${error}"></div>
                        <div th:if="${param.logout}" class="alert alert-info mt-3 py-2 small">Sesión cerrada correctamente</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
