<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventia - Gestión de Accesos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Montserrat', sans-serif; overflow: hidden; background-color: #0f172a; }
        .fullscreen-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
        .carousel-item img { width: 100vw; height: 100vh; object-fit: cover; filter: brightness(0.6); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(15,23,42,0.4) 0%, rgba(15,23,42,0.85) 100%); z-index: -1; }
        .login-wrapper { height: 100%; display: flex; align-items: center; justify-content: center; z-index: 1; position: relative; padding: 20px; }
        
        .login-box { 
            background-color: rgba(255, 255, 255, 0.98); 
            padding: 45px 40px; border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            border-top: 5px solid #f59e0b; /* Detalle de color oro/amber premium */
            width: 100%; max-width: 440px; 
        }
        .brand-title { font-weight: 700; color: #0f172a; letter-spacing: -1px; font-size: 2.2rem; }
        .form-label { color: #334155; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; display: block; text-align: left; }
        .form-control { border: 2px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; color: #0f172a; font-weight: 500; }
        .form-control:focus { border-color: #f59e0b; box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15); color: #000; }
        
        .btn-premium { 
            background-color: #0f172a; color: #fff; font-weight: 700; border: none; padding: 14px; 
            border-radius: 10px; letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s ease; font-size: 0.9rem;
        }
        .btn-premium:hover { background-color: #1e293b; color: #f59e0b; transform: translateY(-1px); box-shadow: 0 5px 15px rgba(15,23,42,0.2); }
    </style>
</head>
<body>

    <div class="fullscreen-bg">
        <div id="bgCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="6000">
            <div class="carousel-inner">
                <div class="carousel-item active"><img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?q=80&w=2000" alt="Gala"></div>
                <div class="carousel-item"><img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?q=80&w=2000" alt="Evento"></div>
                <div class="carousel-item"><img src="https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?q=80&w=2000" alt="Salon"></div>
            </div>
        </div>
    </div>
    
    <div class="overlay"></div>

    <div class="login-wrapper">
        <div class="login-box shadow-lg animate__animated animate__fadeIn">
            <div class="text-center mb-4">
                <h1 class="brand-title mb-1">EVENTIA</h1>
                <p class="text-muted fw-bold mb-0" style="letter-spacing: 2px; font-size: 0.7rem; text-transform: uppercase;">Smart Event Management</p>
                <div style="background-color: #f59e0b; height: 3px; width: 40px; margin: 15px auto; border-radius: 2px;"></div>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Código / Usuario de Acceso</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario asignado" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Contraseña de Seguridad</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-premium w-100 shadow-sm">Iniciar Sesión</button>
            </form>

            <div th:if="${error}" class="alert alert-danger mt-3 py-2 fw-bold text-center border-0 small" th:text="${error}"></div>
            <div th:if="${param.logout}" class="alert alert-success mt-3 py-2 fw-bold text-center border-0 small">Sesión finalizada correctamente.</div>
            
            <div class="text-center mt-4 pt-2">
                <p class="text-muted mb-0" style="font-size: 0.65rem; font-weight: 600;">Plataforma de Control de Accesos Homologada</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
